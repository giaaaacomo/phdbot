[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phd-searcher"
version = "0.1.0"
description = "Backend that scrapes open PhD positions from EU university websites and serves semantic search"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["phd", "scraping", "semantic search", "universities"]
authors = [{ name = "Michele Faedi" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "hypercorn>=0.17",
    "injector>=0.24.0",
    "jinja2>=3.1.4",
    "litellm>=1.83.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "crawl4ai>=0.9.2",
    "qdrant-client>=1.18.0",
    "httpx>=0.28.1",
    "fastapi>=0.139.2",
    "ddgs>=9.14.4",
]

[project.scripts]
phd = "phd_searcher.pipeline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",  # required by fastapi.testclient.TestClient in unit tests
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "pytest-env>=1.6",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phd_searcher"]

[tool.coverage.run]
source = ["src/phd_searcher"]
omit = ["tests/*", "**/__pycache__/*"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests/unit"]

[tool.pytest_env]
env_files = [".env.test"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "C4", "PIE", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["crawl4ai", "crawl4ai.*"]
ignore_missing_imports = true
