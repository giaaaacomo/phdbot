[project]
name = "phd-searcher-integration-tests"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-env>=1.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["."]

[tool.pytest_env]
env_files = ["../../.env.test"]
