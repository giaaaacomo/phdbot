name: Single HTTP Runtime canary
on:
  push:
    branches: [experiment/ddw-runtime-canary]
permissions:
  contents: read
concurrency:
  group: ddw-runtime-canary
  cancel-in-progress: false
jobs:
  one-remote-worker:
    if: >-
      github.repository == 'giaaaacomo/phdbot' &&
      github.run_attempt == 1 &&
      vars.PHDBOT_DDW_CANARY_ENABLED == 'true' &&
      contains(github.event.head_commit.message, '[run-ddw-runtime-canary]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing portable worker dependencies
        run: python -m pip install -r tools/ddw/runtime-requirements.txt
      - name: Temporary private network identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ vars.PHDBOT_TS_CLIENT_ID }}
          audience: ${{ vars.PHDBOT_TS_AUDIENCE }}
          tags: tag:phdbot-canary-runner
          hostname: phdbot-canary-${{ github.run_id }}
      - name: Verify isolation and execute one centrally assigned job
        env:
          DDW_ENDPOINT: ${{ vars.PHDBOT_DDW_ENDPOINT }}
          DDW_WORKER_ID: ${{ vars.PHDBOT_DDW_WORKER_ID }}
          DDW_JOB_ID: ${{ vars.PHDBOT_DDW_JOB_ID }}
          DDW_TOKEN: ${{ secrets.PHDBOT_DDW_CANARY_TOKEN }}
          DDW_SIGNING_KEY: ${{ secrets.PHDBOT_DDW_CANARY_SIGNER }}
        run: timeout 150s python tools/ddw/runtime_canary.py
      - name: Preserve ciphertext and minimized receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddw-runtime-${{ github.run_id }}
          path: |
            ddw-runtime-artifacts/evidence.sealed.json
            ddw-runtime-artifacts/checksums.json
            ddw-runtime-artifacts/receipt.json
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: false
