stages: [lint, test, build]

variables:
  UV_VERSION: "0.11"

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  before_script:
    - uv sync

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run mypy src

test-unit:
  stage: test
  script:
    - PYTHONPATH=src uv run pytest --cov=src tests/unit/

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - uv build
