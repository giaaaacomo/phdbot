services:
  api:
    build:
      context: .
    image: phd-searcher:dev
    ports:
      - "${API_HOST_PORT:-8003}:8000"
    env_file:
      - .env
    environment:
      # Override the DB host to reach the compose service (env_file points at localhost).
      PHD_SEARCHER__DATABASE__URL: postgresql+asyncpg://app:app@postgres:5432/app
      PHD_SEARCHER__QDRANT__URL: http://qdrant:6333
    extra_hosts:
      # LLM locale sull'host raggiungibile dal container come host.docker.internal
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
